<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="550" viewBox="0 0 1080 550" role="img" aria-labelledby="title desc"><title id="title">05 / Ramp Atlas：把美术风格变成可寻址的数据</title><desc id="desc">示意图使用三行两段式 Ramp。实际可使用平滑颜色曲线与多级阴影。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#49b1f5"/></marker></defs><rect width="1080" height="550" rx="20" fill="#f8fbff"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="38" y="49" font-size="29" fill="#253552" font-weight="650">05 / Ramp Atlas：把美术风格变成可寻址的数据</text><text x="38" y="83" font-size="16" fill="#70829a" font-weight="400">示意图使用三行两段式 Ramp。实际可使用平滑颜色曲线与多级阴影。</text><rect x="210" y="155" width="500" height="52" rx="14" fill="#25345e" stroke="none"/><rect x="460" y="155" width="250" height="52" fill="#9ed4ff"/><text x="40" y="188" font-size="23" fill="#253552" font-weight="400">row 0</text><path d="M715 181 L766 181" stroke="#49b1f5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="790" y="188" font-size="22" fill="#253552" font-weight="400">v = 0.5 / 3</text><rect x="210" y="231" width="500" height="52" rx="14" fill="#733e64" stroke="none"/><rect x="460" y="231" width="250" height="52" fill="#ffd3cf"/><text x="40" y="264" font-size="23" fill="#253552" font-weight="400">row 1</text><path d="M715 257 L766 257" stroke="#49b1f5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="790" y="264" font-size="22" fill="#253552" font-weight="400">v = 1.5 / 3</text><rect x="210" y="307" width="500" height="52" rx="14" fill="#304e4b" stroke="none"/><rect x="460" y="307" width="250" height="52" fill="#c7ebc7"/><text x="40" y="340" font-size="23" fill="#253552" font-weight="400">row 2</text><path d="M715 333 L766 333" stroke="#49b1f5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="790" y="340" font-size="22" fill="#253552" font-weight="400">v = 2.5 / 3</text><path d="M210 395 L710 395" stroke="#49b1f5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="300" y="433" font-size="20" fill="#253552" font-weight="400">u：暗色 ← 光照坐标 → 亮色</text><text x="40" y="483" font-size="19" fill="#70829a" font-weight="400">每一行是一套风格；取行中心，避免把邻行颜色一起插值。</text><text x="38" y="528" font-size="13" fill="#70829a" font-weight="400">BYTIVOR / TECHNICAL NOTES · 原创原理示意</text></g></svg>