<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540" role="img" aria-labelledby="title desc"><title id="title">04 / 形体明暗 ≠ 遮挡阴影</title><desc id="desc">前两个面板为权重，白 = 1，黑 = 0；第三个面板为最终线性颜色的 sRGB 显示。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#49b1f5"/></marker></defs><rect width="1080" height="540" rx="20" fill="#f8fbff"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="38" y="49" font-size="29" fill="#253552" font-weight="650">04 / 形体明暗 ≠ 遮挡阴影</text><text x="38" y="83" font-size="16" fill="#70829a" font-weight="400">前两个面板为权重，白 = 1，黑 = 0；第三个面板为最终线性颜色的 sRGB 显示。</text><rect x="38" y="115" width="330" height="365" rx="14" fill="#fff" stroke="none"/><image x="83" y="130" width="240" height="240" href="data:image/png;base64,"/><text x="60" y="405" font-size="22" fill="#253552" font-weight="600">Q：形体分层</text><text x="60" y="441" font-size="16" fill="#70829a" font-weight="400">只由法线和光向决定</text><rect x="388" y="115" width="330" height="365" rx="14" fill="#fff" stroke="none"/><image x="433" y="130" width="240" height="240" href="data:image/png;base64,"/><text x="410" y="405" font-size="22" fill="#253552" font-weight="600">V：投影可见性</text><text x="410" y="441" font-size="16" fill="#70829a" font-weight="400">演示遮挡物形成的一条阴影</text><rect x="738" y="115" width="330" height="365" rx="14" fill="#fff" stroke="none"/><image x="783" y="130" width="240" height="240" href="data:image/png;base64,"/><text x="760" y="405" font-size="22" fill="#253552" font-weight="600">Q × V：合并</text><text x="760" y="441" font-size="16" fill="#70829a" font-weight="400">只在共同允许的位置进入亮色</text><text x="38" y="518" font-size="13" fill="#70829a" font-weight="400">BYTIVOR / TECHNICAL NOTES · 原创原理示意</text></g></svg>