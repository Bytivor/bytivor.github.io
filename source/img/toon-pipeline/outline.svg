<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc"><title id="title">06 / 描边不是把所有变化都画黑</title><desc id="desc">边缘检测负责找变化；材质掩码、阈值和采样半径决定哪些变化值得保留。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#49b1f5"/></marker></defs><rect width="1080" height="500" rx="20" fill="#f8fbff"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="38" y="49" font-size="29" fill="#253552" font-weight="650">06 / 描边不是把所有变化都画黑</text><text x="38" y="83" font-size="16" fill="#70829a" font-weight="400">边缘检测负责找变化；材质掩码、阈值和采样半径决定哪些变化值得保留。</text><rect x="38" y="140" width="300" height="290" rx="14" fill="#fff" stroke="#dceaf8"/><text x="58" y="187" font-size="26" fill="#253552" font-weight="600">深度边缘</text><text x="58" y="244" font-size="17" fill="#70829a" font-weight="400">找到轮廓、遮挡交界</text><text x="58" y="302" font-size="17" fill="#70829a" font-weight="400">线性深度差 / 中心深度</text><text x="58" y="360" font-size="17" fill="#70829a" font-weight="400">防止距离变化放大阈值误差</text><rect x="390" y="140" width="300" height="290" rx="14" fill="#fff" stroke="#dceaf8"/><text x="410" y="187" font-size="26" fill="#253552" font-weight="600">法线边缘</text><text x="410" y="244" font-size="17" fill="#70829a" font-weight="400">找到折角、内部结构</text><text x="410" y="302" font-size="17" fill="#70829a" font-weight="400">1 − dot(N₀, Nᵢ)</text><text x="410" y="360" font-size="17" fill="#70829a" font-weight="400">需要抑制细碎法线纹理</text><rect x="742" y="140" width="300" height="290" rx="14" fill="#fff" stroke="#dceaf8"/><text x="762" y="187" font-size="26" fill="#253552" font-weight="600">选择与合成</text><text x="762" y="244" font-size="17" fill="#70829a" font-weight="400">材质 ID / Stencil 限定对象</text><text x="762" y="302" font-size="17" fill="#70829a" font-weight="400">合并边缘后再上色</text><text x="762" y="360" font-size="17" fill="#70829a" font-weight="400">按实际 RT 尺寸计算采样偏移</text><text x="38" y="478" font-size="13" fill="#70829a" font-weight="400">BYTIVOR / TECHNICAL NOTES · 原创原理示意</text></g></svg>